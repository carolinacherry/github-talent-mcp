name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The published package and the install instructions can rot without a commit,
    # so check them weekly too.
    - cron: "0 9 * * 1"

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the README badge and pyproject claim to support.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }}
      # pytest is not a project dependency; supply it per-run rather than
      # shipping test tooling in the published package.
      - run: uv run --python ${{ matrix.python }} --with pytest --with pytest-asyncio pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uvx ruff check \
            src/github_talent_mcp/tools/_offer.py \
            tests/test_dashboard_offer.py \
            tests/test_profile_resilience.py \
            tests/test_rate_limit.py \
            scripts/

  docs:
    name: README matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python scripts/check_docs.py

  install-from-source:
    name: install instructions (from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Exactly what the README's "Running from source" section tells users to do.
      - run: uv sync
      - name: server starts and lists its tools
        # Hold stdin open after the last message: closing it immediately can make
        # the server exit on EOF before it answers, which fails at random.
        run: |
          { printf '%s\n%s\n%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 10; } \
          | uv run github-talent-mcp 2>/dev/null \
          | python3 scripts/assert_tools.py

  install-from-pypi:
    name: install instructions (published package)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The command the README gives users, against whatever is live on PyPI.
      # Catches a release that was never published, or one that cannot start.
      - name: uvx github-talent-mcp starts and lists its tools
        env:
          GITHUB_TOKEN: placeholder
        run: |
          { printf '%s\n%s\n%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 10; } \
          | uvx --refresh github-talent-mcp 2>/dev/null \
          | python3 scripts/assert_tools.py
